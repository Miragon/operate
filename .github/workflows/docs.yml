# The docs site (docs/, VitePress): built on every pull request that changes it, so a dead link
# fails the pull request, and published to GitHub Pages (https://miragon.github.io/operate/) from
# main. Needs "Settings > Pages > Build and deployment > Source: GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded builds; every other run gets its own group. The deploy job has
# the pages group of its own.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm run docs:build
        env:
          # Project pages are served under /<repo>/: the VitePress config reads this to set `base`
          # (it defaults to "/" for local dev).
          DOCS_BASE: /operate/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a queued deploy waits instead of cancelling the running one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
