name: Docs

# operate is now Pulse CLI, and its docs moved to https://miragon.github.io/pulse/cli/. GitHub Pages
# (https://miragon.github.io/operate/) serves redirects/ as it is: one page per page of the old
# site that sends the reader to the same page under the new address, a 404 page that maps every
# other old address the same way, and the files the old site served from docs/public/. No build
# and no install: a pull request only checks the pages, a push to main also deploys them. docs/
# stays as history and is no longer published.
# Needs "Settings > Pages > Build and deployment > Source: GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'redirects/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'redirects/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Check the redirects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every page sends the reader to the new docs: a script that keeps the hash, a refresh for
      # readers without scripts and a canonical link.
      - name: Check the redirect pages
        working-directory: redirects
        run: |
          test -f 404.html && test -f index.html
          shopt -s globstar
          status=0
          for page in **/*.html; do
            if [ "$page" = 404.html ]; then continue; fi
            for part in 'location.replace(' 'http-equiv="refresh"' 'rel="canonical"'; do
              if ! grep -qF "$part" "$page"; then
                echo "::error file=redirects/$page::$part is missing"
                status=1
              fi
            done
          done
          exit "$status"

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirects
          # .nojekyll
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a queued deploy finishes instead of being cancelled.
    # Checks of pull requests never wait for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
