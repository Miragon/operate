# Squash merges use the pull request title as the commit message, and release-please builds the
# version bump and the changelog from those messages: the title must follow Conventional Commits.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

# Not cancelled: release-please pushes and edits its pull request at the same moment, and a
# cancelled run would show as a failed check next to the successful one.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The types are the changelog sections of release-please-config.json.
      - name: Check that the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|revert|deps|docs|refactor|test|build|ci|style|chore'
          pattern="^(${types})(\([A-Za-z0-9._/-]+\))?!?: [^[:space:]]"
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title::Title \"${TITLE}\" is not a Conventional Commit: use <type>[(<scope>)][!]: <description> with type ${types//|/, }"
            exit 1
          fi
          echo "Title \"${TITLE}\" is a Conventional Commit"
