# Quality gates: fast checks on Node 22/24, validation of the Claude Code plugin, Testcontainers
# integration tests per engine, the standalone executable and the container image, and incremental
# mutation testing (informational on pull requests; in full weekly and on demand).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC: full mutation run
  workflow_dispatch:
    inputs:
      full-mutation:
        description: Re-test every mutant and refresh the incremental mutation baseline
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs; every other run gets its own group, so a long mutation run
# on main never holds back the checks of the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test the bundle
        run: node dist/operate.js --version
      - name: Upload coverage
        if: always() && matrix.node == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The Claude Code plugin: the marketplace at the repository root (with the plugin manifest it
  # lists), the plugin in skills/operate (manifest and command) and its skill (validated as part of
  # skills/, since a plugin run skips a SKILL.md at the plugin root). `claude plugin validate` needs
  # no account or API key; the stable channel of Claude Code is typically a week old and skips
  # releases with major regressions.
  plugin:
    name: Claude Code plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      # The postinstall script of the package puts the native binary in place.
      - name: Install Claude Code
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
      - name: Validate the marketplace and the plugin
        run: |
          claude --version
          for target in . skills/operate skills; do
            claude plugin validate --strict "$target"
          done

  integration:
    name: integration (${{ matrix.engine }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [operaton, cibseven, camunda]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          OPERATE_IT_ENGINES: ${{ matrix.engine }}
          # the packed-tarball smoke test does not depend on the engine: run it in one leg only
          OPERATE_IT_SKIP_PACK: ${{ matrix.engine == 'operaton' && '0' || '1' }}

  # The standalone executable (design §20) of linux-x64, built like the release builds it on each
  # of its five runners. Besides the smoke test, the Operaton suites run against the binary, so a
  # bundling or SEA defect (module loading, fetch, stdin, loopback server) fails here, not after a
  # release.
  standalone:
    name: standalone executable (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - run: npm run build:exe
      - name: Smoke test the binary
        run: scripts/smoke-test.sh build/bin/operate-linux-x64
      - name: Integration tests against the binary
        run: npm run test:integration
        env:
          OPERATE_IT_BINARY: ${{ github.workspace }}/build/bin/operate-linux-x64
          OPERATE_IT_ENGINES: operaton
          OPERATE_IT_SKIP_PACK: '1'

  # The container image (design §20) for both platforms, without pushing; the smoke test runs the
  # image of the runner's platform.
  image:
    name: container image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build the image of this platform
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: operate:ci
      - name: Smoke test the image
        run: scripts/smoke-test.sh docker run --rm -i operate:ci
      # node is PID 1 in the container: without its own handler (src/bin/operate.ts) the kernel
      # drops SIGTERM and SIGINT, and docker stop would need SIGKILL after the timeout (137).
      - name: docker stop ends a waiting command
        run: |
          docker run -d -i --name operate-signal operate:ci process-definition list --dry-run \
            --url http://engine.example/engine-rest --auth basic --auth-user demo --auth-password-stdin
          sleep 2
          docker stop -t 10 operate-signal
          code="$(docker inspect -f '{{.State.ExitCode}}' operate-signal)"
          docker rm operate-signal
          if [ "$code" != 143 ]; then
            echo "::error::docker stop ended the CLI with exit code ${code}, expected 143 (SIGTERM)"
            exit 1
          fi

  # StrykerJS in shards (STRYKER_SHARD, see stryker.config.js), each with its own incremental
  # baseline in the Actions cache: a run re-tests only the mutants whose code or covering tests
  # changed since that baseline. Pushes to main restore and save it. The weekly run and a manual
  # run with full-mutation start without a baseline (as --force would) and save their result as
  # the new one. Stryker's diff sees mutated and test files only, so the key carries a fingerprint
  # of what every test depends on: the Stryker, vitest and TypeScript configuration, the installed
  # dependencies and the Node major. Any change there finds no baseline and re-tests every mutant.
  # Options that change results therefore belong in stryker.config.js, not on the command line
  # below. Pull requests never run in full: they restore the baseline of main and never save one,
  # and a shard without a baseline for its fingerprint skips Stryker (dependency, configuration or
  # Node changes; the push to main and the weekly run test those).
  mutation:
    name: mutation (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # One run per shard at a time outside pull requests, so each starts from the previous baseline.
    concurrency:
      group: mutation-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      STRYKER_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      FULL_RUN: ${{ github.event_name == 'schedule' || inputs.full-mutation == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Fingerprint the mutation testing setup
        id: baseline
        run: |
          config=$(cat stryker.config.js vitest.config.ts tsconfig.json | sha256sum | cut -c1-16)
          # the dependency tree without the package's own version, which every release bumps
          deps=$(jq -c 'del(.version, .packages[""].version)' package-lock.json | sha256sum | cut -c1-16)
          node=$(node -p 'process.versions.node.split(".")[0]')
          echo "key=stryker-node$node-$config-$deps-shard${{ matrix.shard }}" >> "$GITHUB_OUTPUT"
      # Caches are immutable: the run id in the key lets every run save, the newest one is restored.
      - name: Restore the incremental baseline
        id: restore
        if: env.FULL_RUN != 'true'
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.baseline.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.baseline.outputs.key }}-
      # The mutation score job reports skipped shards (no report) on the pull request.
      - name: Skip without a baseline of main
        if: github.event_name == 'pull_request' && steps.restore.outputs.cache-matched-key == ''
        env:
          KEY: ${{ steps.baseline.outputs.key }}
        run: |
          echo "main has no baseline $KEY-*, and a pull request never runs in full: skipped."
          echo "SKIP_MUTATION=true" >> "$GITHUB_ENV"
      - run: npm ci
        if: env.SKIP_MUTATION != 'true'
      # exec: Stryker itself gets the interrupt of a timeout or cancellation, saves the results so
      # far to the incremental file and the next run continues from there.
      - name: Mutation testing
        if: env.SKIP_MUTATION != 'true'
        timeout-minutes: 150
        run: exec node_modules/.bin/stryker run --concurrency 4
      - name: Save the incremental baseline
        if: >-
          always() && github.event_name != 'pull_request' &&
          hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.baseline.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the mutation report
        if: always() && env.SKIP_MUTATION != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
          # "Re-run failed jobs" keeps the artifacts of the first attempt
          overwrite: true

  # The shards run without a break threshold; this job applies it to the score of all mutants. It
  # also runs when a shard failed and then fails itself, instead of being skipped (a skipped job
  # passes as a required check). On pull requests it only reports (--informational): the score of
  # the shards that ran, the skipped ones and a score below the threshold become annotations and
  # the job summary, never a failure, so no mutation job is a merge criterion. Pushes to main and
  # the weekly run enforce the threshold. Superseded (cancelled) runs skip it.
  mutation-score:
    name: mutation score
    needs: mutation
    if: ${{ !cancelled() && needs.mutation.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFORMATIONAL: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require every shard
        if: needs.mutation.result != 'success'
        env:
          RESULT: ${{ needs.mutation.result }}
        run: |
          message="A mutation shard did not finish (result: $RESULT), see the mutation jobs."
          if [ "$INFORMATIONAL" = true ]; then
            echo "::warning::$message"
          else
            echo "::error::$message"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-*
          path: reports/shards
      - name: Mutation score
        run: |
          shopt -s nullglob
          args=(reports/shards/*/mutation.json)
          if [ "$INFORMATIONAL" = true ]; then args=(--informational "${args[@]}"); fi
          npm run test:mutation:score -- "${args[@]}"
