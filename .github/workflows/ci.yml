# Quality gates: fast checks on Node 22/24, validation of the Claude Code plugin, Testcontainers
# integration tests per engine, and mutation testing on main, weekly and on demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC: weekly mutation run
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs; every other run gets its own group, so a long mutation run
# on main never holds back the checks of the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test the bundle
        run: node dist/operate.js --version
      - name: Upload coverage
        if: always() && matrix.node == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The Claude Code plugin: the marketplace at the repository root (with the plugin manifest it
  # lists), the plugin in skills/operate (manifest and command) and its skill (validated as part of
  # skills/, since a plugin run skips a SKILL.md at the plugin root). `claude plugin validate` needs
  # no account or API key; the stable channel of Claude Code is typically a week old and skips
  # releases with major regressions.
  plugin:
    name: Claude Code plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      # The postinstall script of the package puts the native binary in place.
      - name: Install Claude Code
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
      - name: Validate the marketplace and the plugin
        run: |
          claude --version
          for target in . skills/operate skills; do
            claude plugin validate --strict "$target"
          done

  integration:
    name: integration (${{ matrix.engine }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [operaton, cibseven, camunda]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          OPERATE_IT_ENGINES: ${{ matrix.engine }}
          # the packed-tarball smoke test does not depend on the engine: run it in one leg only
          OPERATE_IT_SKIP_PACK: ${{ matrix.engine == 'operaton' && '0' || '1' }}

  mutation:
    name: mutation
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: mutation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Restore the incremental mutation result
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-
      - run: npm run test:mutation -- --concurrency 4
      - name: Save the incremental mutation result
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
