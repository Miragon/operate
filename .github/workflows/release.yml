# Releases with release-please and publishes @miragon/operate to npm with trusted publishing (OIDC,
# no npm token). Every push to main opens or updates the release pull request; merging it tags
# v<version>, creates the GitHub release and publishes that tag to npm, attaches the standalone
# executables and their .tar.xz archives (with SHA256SUMS and provenance attestations) to the
# release, publishes them as the Homebrew formula miragon/tap/operate and pushes the container
# image ghcr.io/miragon/operate (design §20).
# The trusted publisher on npmjs.com names this file (release.yml) and the `npm` environment:
# renaming either breaks publishing until the configuration on npmjs.com is recreated.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release run at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release branch, tags and releases
      issues: write # autorelease labels
      pull-requests: write # release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pull requests opened with GITHUB_TOKEN start no CI run without a manual approval. A GitHub
      # App (vars.RELEASE_PLEASE_APP_CLIENT_ID + secrets.RELEASE_PLEASE_APP_PRIVATE_KEY) or a
      # fine-grained token (secrets.RELEASE_PLEASE_TOKEN) avoids that; GITHUB_TOKEN is the fallback.
      - name: Create a GitHub App token
        id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # The Miragon org app (miragon-release-please) grants contents and pull_requests, not
          # issues; pull request labels work with pull_requests: write.
          permission-contents: write
          permission-pull-requests: write
      # No release-type input: manifest mode, configured by release-please-config.json and
      # .release-please-manifest.json on main.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Checks, builds and packs the release without the id-token permission: install scripts of
  # dependencies never run next to the OIDC token. No dependency cache in release jobs.
  build:
    name: build ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # The CLI hints and the README link to issues of the public repository, and npm provenance
      # needs a public source repository: publish only from a public repository. Asks the API, not
      # the event payload, which a re-run repeats unchanged.
      - name: Check that the repository is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != public ]; then
            echo "::error::${GITHUB_REPOSITORY} is ${visibility}: ${TAG} is tagged but not published. Make the repository public, then re-run the failed jobs of this run."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      # npm provenance names the commit that triggered this run (GITHUB_SHA), not the tagged one;
      # they differ when a later push or a manual run created the release.
      - name: Check that the release tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Release ${TAG} (version ${VERSION}) does not match package.json version ${version}"
            exit 1
          fi
          tagged="$(git rev-parse HEAD)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::warning::${TAG} points to ${tagged}, this run was triggered by ${GITHUB_SHA}: the npm provenance names ${GITHUB_SHA} as the source commit"
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test the bundle
        run: test "$(node dist/operate.js --version)" = "$VERSION"
      # One standalone bundle for the executables and the container image (design §20)
      - run: npm run build:standalone
      - name: Smoke test the standalone bundle
        run: scripts/smoke-test.sh node build/standalone/operate.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: build/standalone/operate.cjs
          if-no-files-found: error
          retention-days: 7
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ needs.release-please.outputs.tag_name }} to npm
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com names this environment; protect it in the repository
    # settings (deployment branch main, optional required reviewers).
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure an npm with trusted publishing (>= 11.5.1)
        run: |
          if ! node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); process.exit(major * 1e6 + minor * 1e3 + patch >= 11005001 ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          echo "npm $(npm --version)"
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package
      # No npm token anywhere: if the OIDC exchange fails, npm logs why only at verbose level and
      # then fails with E401, E404 or ENEEDAUTH. "Re-run with debug logging" shows that log.
      # npm refuses a prerelease version without an explicit dist-tag; such versions go to "next"
      # so `latest` keeps pointing at the newest stable release. A version that is already on npm
      # (re-run, manual first publish) is skipped.
      - name: Publish to npm
        env:
          NPM_CONFIG_LOGLEVEL: ${{ runner.debug == '1' && 'verbose' || 'notice' }}
        run: |
          shopt -s failglob
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected one package tarball, got ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          name="$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")"
          version="$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::The package tarball holds version ${version}, the release is ${VERSION}"
            exit 1
          fi
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::${name}@${version} is already on npm, nothing to publish"
            exit 0
          fi
          case "${version%%+*}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          if ! npm publish "$tarball" --access public --provenance --tag "$tag"; then
            echo "::error::npm publish failed. E401, E404 or ENEEDAUTH mean the OIDC exchange failed: check the trusted publisher of ${name} on npmjs.com (Miragon/operate, release.yml, environment npm, npm publish allowed) and re-run with debug logging for npm's oidc log."
            exit 1
          fi

  # Standalone executables (design §20): the standalone bundle of the build job injected into
  # Node.js 24 as single executable application, each target on a native runner (the V8 code
  # cache is only valid on the platform that built it) and smoke tested there. No write access
  # and no id-token: dependency install scripts never run next to a token.
  binaries:
    name: binary ${{ matrix.target }}
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, file: operate-linux-x64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, file: operate-linux-arm64 }
          - { target: macos-x64, runner: macos-26-intel, file: operate-macos-x64 }
          - { target: macos-arm64, runner: macos-latest, file: operate-macos-arm64 }
          - { target: windows-x64, runner: windows-latest, file: operate-windows-x64.exe }
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
      # Git Bash on Windows must pass the smoke test's URL arguments unchanged
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The binary embeds this Node.js: take the newest 24.x release (security fixes) rather than
      # the possibly older one in the runner's tool cache, the same on every runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
      # tsx and postject need no install scripts
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: standalone
          path: build/standalone
      - run: npm run build:exe
      - name: Smoke test the binary
        run: bash scripts/smoke-test.sh "build/bin/${{ matrix.file }}"
      # The macOS and Linux binaries also as <file>.tar.xz holding an executable `operate`, a fifth
      # of the download, which the Homebrew formula takes. GNU tar passes XZ_OPT to xz.
      - name: Pack the binary
        if: runner.os != 'Windows'
        env:
          XZ_OPT: -T0
        run: |
          mkdir build/pack
          install -m 0755 "build/bin/${{ matrix.file }}" build/pack/operate
          tar -C build/pack -cJf "build/bin/${{ matrix.file }}.tar.xz" operate
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: build/bin/${{ matrix.file }}*
          if-no-files-found: error
          retention-days: 7

  # Attaches the binaries, their archives and SHA256SUMS to the GitHub release and attests their
  # build provenance (`gh attestation verify <file> --repo Miragon/operate`). Runs no repository
  # code. A re-run replaces the assets.
  release-assets:
    name: attach binaries to ${{ needs.release-please.outputs.tag_name }}
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing certificate of the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/binaries
        run: |
          shopt -s failglob
          files=(operate-*)
          if [ "${#files[@]}" -ne 9 ]; then
            echo "::error::Expected 5 binaries and 4 archives, got ${#files[@]}: ${files[*]}"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/binaries/SHA256SUMS
      - name: Upload to the release
        working-directory: ${{ runner.temp }}/binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" operate-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Homebrew formula of the attached binaries (publish-homebrew.yml), not for prereleases: the tap
  # has one formula, which follows the newest stable release.
  homebrew:
    name: homebrew formula ${{ needs.release-please.outputs.version }}
    needs: [release-please, release-assets]
    if: needs.release-please.outputs.release_created == 'true' && !contains(needs.release-please.outputs.version, '-')
    permissions:
      contents: read
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  # Container image (design §20) after the npm publish: the standalone bundle of the build job on
  # distroless Node.js 24 (non-root), linux/amd64 and linux/arm64, tagged <version>, <major.minor>
  # and latest (prereleases only <version>), with BuildKit SBOM and provenance and a GitHub
  # attestation (`gh attestation verify oci://ghcr.io/miragon/operate:<version> --repo
  # Miragon/operate`). The GHCR package is private after its first push until a maintainer makes it
  # public (docs/releasing.md, one-time setup).
  image:
    name: image ghcr.io/miragon/operate:${{ needs.release-please.outputs.version }}
    needs: [release-please, build, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout, repository metadata for the labels
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing certificate of the attestation
      attestations: write # store the attestation
    env:
      IMAGE: ghcr.io/miragon/operate
      VERSION: ${{ needs.release-please.outputs.version }}
      EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The labels name the tagged commit, which differs from GITHUB_SHA when a later push or a
      # manual run created the release.
      - name: Find the tagged commit
        id: tagged
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: standalone
          path: build/standalone
      - uses: docker/setup-buildx-action@v4
      - name: Build the image of this platform
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: operate:smoke
      - name: Smoke test the image
        run: scripts/smoke-test.sh docker run --rm -i operate:smoke
      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows the description of a multi-platform image from the index annotations
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tagged.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.tagged.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # a storage record needs the artifact-metadata permission and is not needed here
          create-storage-record: false
