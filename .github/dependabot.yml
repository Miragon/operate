version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional commit messages for release-please: runtime dependencies are user facing
    # ("deps:", Dependencies section, patch release), development dependencies are not
    # ("chore(deps-dev):", no release)
    commit-message:
      prefix: deps
      prefix-development: chore(deps-dev)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # the Node types follow the oldest supported runtime (engines: node >= 22.12), so newer
      # Node APIs can not slip in unnoticed
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # "ci:" is hidden in the changelog and starts no release
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
