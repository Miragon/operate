name: Bug Report
description: Report a bug or unexpected behaviour in @miragon/operate
title: '[Fix]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below to help us reproduce and fix the issue.
        The exact command and its error output (one JSON line on stderr) are by far the fastest path to a fix.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The exact commands, with secrets removed. `--dry-run` and `--verbose` show the request that was sent.
      placeholder: |
        1. operate deploy order.bpmn --start --business-key ORD-1001
        2. operate advance --business-key ORD-1001 ...
        3. Observe the following error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the output and the error line from stderr.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: operate Version
      description: The output of `operate --version`.
      placeholder: '0.5.0'
    validations:
      required: false

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: The engine and its version, as `operate ping` reports it.
      options:
        - Operaton
        - CIB seven
        - Camunda 7
    validations:
      required: false

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - npm package
        - Standalone executable
        - Container image
    validations:
      required: false
